name: check

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rokit
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true
      # NB: no separate `rokit install` - setup-rokit already installs
      # all rokit.toml tools (it passes --no-trust-check internally).
      - run: lune run tests/run.luau
      - run: rojo sourcemap default.project.json -o sourcemap.json
      - run: luau-lsp analyze --sourcemap sourcemap.json "--definitions:typedefs/globalTypes.PluginSecurity.d.luau" src/
      - run: stylua --check src/ tests/
      - run: rojo build -o game.rbxlx
