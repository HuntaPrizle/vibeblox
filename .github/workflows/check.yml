name: check

on:
  push:
  pull_request:

jobs:
  gate:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rokit
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true
      # NB: no separate `rokit install` - setup-rokit already installs
      # all rokit.toml tools (it passes --no-trust-check internally).
      - run: lune run scripts/check.luau
